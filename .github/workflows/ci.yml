name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    # No path filter on pull_request: the "Lint, type-check, test" job is
    # a required status check via the Protect main ruleset, and
    # path-filtered required checks never report on PRs that don't touch
    # the filtered paths — leaving doc-only PRs blocked indefinitely.
    # Always running CI on PRs reports the check; uv cache keeps it fast.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # Drift here is silent everywhere else: `uv sync` and `uv run` rewrite the
      # lock in place, so a stale lock surfaces as an unexplained modified file
      # in a contributor's tree rather than as an error. Named as its own step so
      # the failure says what to run.
      - name: Lockfile is in sync
        run: |
          if ! uv lock --check; then
            echo "::error title=uv.lock is out of sync with pyproject.toml::Run 'uv lock' and commit the result. If this appeared right after a release, the release job failed to re-lock — see build_command in pyproject.toml."
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest
