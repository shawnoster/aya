name: Gateway CI

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    branches: [main]
    # No path filter on pull_request — same reasoning as the main aya
    # workflow: required status checks gated on path filters never
    # report on PRs that don't touch those paths, blocking unrelated
    # PRs indefinitely. uv cache keeps this fast.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Gateway lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # Same reason as the root workflow: uv rewrites a stale lock in place
      # rather than erroring, so drift shows up as an unexplained dirty file in
      # a contributor's tree instead of as a failure here. Releases do not bump
      # this project's version, so the exposure is a dependency edit, not a tag.
      - name: Lockfile is in sync
        run: |
          if ! uv lock --check; then
            echo "::error title=gateway/uv.lock is out of sync with gateway/pyproject.toml::Run 'uv lock' in gateway/ and commit the result."
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest
