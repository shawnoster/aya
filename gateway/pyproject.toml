[project]
name = "aya-gateway"
version = "0.1.0"
description = "Personal HTTP gateway — phone capture, effects, webhooks. Sibling to the aya CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
    "httpx2>=2.10",
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
# Same rationale as the root config: a branch that cannot run means a
# condition upstream is not what its author expected.
warn_unreachable = true
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
