[project]
name = "aya-ai-assist"
version = "2.2.1"
description = "Personal AI assistant toolkit — sync, schedule, identity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27",
    "cryptography>=50",
    "websockets>=17",
    "python-ulid>=4",
    "pydantic>=2",
    "rich>=15",
    "base58>=2",
    "coincurve>=20.0.0,<22",  # 21.0.0 has no cp314 wheel; source build fails on cffi 2.0.0 (see #101)
    "mcp>=2",  # 2.0 replaced the Server list_tools/call_tool decorators with on_* callbacks
]

[project.optional-dependencies]
# Only for the release job. semantic-release's build_command runs inside the
# action's Docker image, which has pip but not uv, so uv has to be installed
# there — and pinning it here rather than curling a script keeps it visible to
# dependency bots. build_command reads this pin rather than repeating it.
#
# Never install this extra with the project attached (`pip install '.[build]'`):
# that builds aya's own dependencies, and the action's image runs Python 3.14,
# where coincurve's cffi build fails (same reason as the pin on line 15).
build = ["uv~=0.12.5"]

[project.scripts]
aya = "aya.adapters.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aya"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pylint>=4",
    "pytest>=9",
    "pytest-asyncio>=1",
    "mypy>=2.3",
    "respx>=0.22",
    "pre-commit>=4",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # unused arguments
    "PTH",  # pathlib usage
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # Ruff-specific rules
    "ANN",  # flake8-annotations
    "SLF",  # flake8-self — src/ must not reach into private members
    "BLE",  # flake8-blind-except — a bare `except Exception` needs a stated reason
]
ignore = [
    "B008",    # Typer/Click intentionally uses function calls in parameter defaults
    "ANN401",  # allow Any when unavoidable in boundary code
    "S101",    # allow assert (especially in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["aya"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",      # test signatures don't need full annotations
    "SLF001",   # tests assert on private state on purpose
    "ARG",      # pytest fixtures often look unused
    "PLR2004",  # magic values in test assertions
    "S",        # tests may use patterns flagged by security rules
    "T20",      # print useful in debugging tests
    "RUF001",   # EN dashes intentional in time-range test data
    "PLC0415",  # module-level import inside test helper
]
"src/aya/ci.py" = [
    "S603",     # subprocess call — git/gh CLI, not untrusted input
]
"src/aya/workspace.py" = [
    "E501",     # long lines in embedded markdown/shell templates — can't wrap
    "S110",     # try-except-pass intentional (best-effort dotfile writes)
    "S603",     # subprocess call without shell — intentional (no shell injection risk)
    "S607",     # partial path — intentional (python3 resolved from PATH)
    "PLW1510",  # subprocess.run without check — best-effort scaffold step
    "ARG001",   # unused arg in callback signature required by caller contract
]
"src/aya/scheduler/__init__.py" = [
    "F401",     # re-exports for backwards compatibility
    "I001",     # import grouping: re-exports organised by submodule, not stdlib order
    "RUF022",   # __all__ grouped by submodule, not alphabetically
]
"src/aya/scheduler/core.py" = [
    "SIM102",   # nested if intentional for readability
]
"src/aya/scheduler/providers.py" = [
    "S603",     # subprocess call — gh CLI, not untrusted input
    "S607",     # partial path — gh resolved from PATH
    "PLC0415",  # httpx is an optional dep; import kept lazy inside try/except
]
"src/aya/scheduler/storage.py" = [
    "PLC0415",  # deferred import of package __init__ for monkeypatch support
]
"src/aya/scheduler/time_utils.py" = [
    "PLC0415",  # deferred import of storage to break circular dependency
]
"src/aya/usecases/ingest.py" = [
    "PLC0415",  # lazy rich/scheduler imports: rich only needed in non-quiet path, scheduler deferred to avoid startup cost
]
"src/aya/adapters/mcp_server.py" = [
    "PLC0415",  # deferred imports keep server startup lean
    "ARG005",   # lambda adapter for status handler ignores args intentionally
]
"src/aya/usecases/watch_chains.py" = [
    "PLC0415",  # deferred scheduler/subprocess imports keep hook startup lean
]
"src/aya/adapters/cli/*.py" = [
    "PLC0415",  # deferred imports keep CLI startup lean
]
"src/aya/usecases/log.py" = [
    "S603",     # subprocess call — git CLI, not untrusted input
    "S607",     # partial path — git resolved from PATH
]
"src/aya/usecases/status.py" = [
    "RUF001",   # EN dashes intentional in time-range parsing strings
    "RUF002",   # EN dashes intentional in time-range parsing docstrings
    "RUF003",   # EN dashes intentional in time-range parsing comments
    "B007",     # unused loop var — pre-existing
    "S110",     # try-except-pass intentional
    "SIM102",   # collapsible-if — pre-existing style
]

[tool.ruff.format]
quote-style = "double"

[tool.pylint.main]
py-version = "3.13"
source-roots = ["src"]

[tool.pylint.messages_control]
disable = ["C0111", "R0903"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
# Understands Pydantic aliases + populate_by_name, so Packet(from_did=...) checks.
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
# PEP 702: fail when we call something a dependency marked @deprecated, so a
# removal in a later release surfaces here rather than at runtime.
enable_error_code = ["deprecated"]
# Dead code is usually a logic bug rather than a tidiness problem: a branch that
# can never run means a condition upstream is not what the author expected. mypy
# errors on any statement it proves cannot execute; where that proof rests on an
# unvalidated annotation, widen the local to `object` so the guard survives
# (see CONTRIBUTING.md).
warn_unreachable = true


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Bumping project.version desynchronises uv.lock, which records the project's own
# version — so `uv lock --check` fails and every contributor's next `make check`
# rewrites the lock, producing a dirty tree nobody asked for. Re-lock here and
# `git add` it, so the bump and the lock arrive in one commit.
#
# --upgrade-package limits the lock to this project's version. A bare `uv lock`
# could pull in newer dependencies that nothing has tested, turning a patch
# release into an untested dependency bump.
#
# $PACKAGE_NAME is provided by semantic-release from project.name.
build_command = """
    set -e
    python -m pip install --quiet "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["build"][0])')"
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
# "angular" was renamed to "conventional" and is removed in v11.
commit_parser = "conventional"

[tool.semantic_release.changelog]
# Insert each release under the flag rather than regenerating the whole file.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
# Only read here. At [tool.semantic_release] it is silently ignored, which is
# why CHANGELOG.md went 88 tags without an update, and the flatter
# [tool.semantic_release.changelog] form is deprecated.
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
